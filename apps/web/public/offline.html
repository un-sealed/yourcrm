<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YourCRM — offline</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f8fafc;
        color: #1e293b;
      }
      main {
        max-width: 24rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #64748b;
        font-size: 0.9rem;
      }
      button {
        border: none;
        border-radius: 0.375rem;
        background: #2563eb;
        color: #fff;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This page hasn't been viewed yet, so there's nothing cached to show. Reconnect and try
        again — pages you've already opened stay available offline.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
