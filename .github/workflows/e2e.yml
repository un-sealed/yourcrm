name: E2E

on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright smoke (web + API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Auth is being built in parallel this week, so these are expected to be
    # flaky. Keep the signal visible without red-blocking every PR.
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yourcrm
          POSTGRES_PASSWORD: yourcrm
          POSTGRES_DB: yourcrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U yourcrm -d yourcrm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://yourcrm:yourcrm@localhost:5432/yourcrm
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # Test-only placeholders so @yourcrm/config startup validation passes.
      # Not real secrets; production values always come from secrets.*.
      SESSION_SECRET: "ci-test-session-secret-not-a-real-secret-0123456789abcdef"
      ENCRYPTION_KEY: "ci-test-encryption-key-not-a-real-secret-0123456789abcdef"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Must match the `packageManager` pin in package.json.
          bun-version: "1.4.2"

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Migrate database
        run: bun run db:migrate

      - name: Build all workspaces
        run: bun run build

      - name: Start API + web
        run: |
          (cd apps/api && bun run start > /tmp/api.log 2>&1 &)
          (cd apps/web && bun run start > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do
            api=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:4000/health || true)
            web=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            if [ "$api" = "200" ] && [ "$web" = "200" ]; then
              echo "API + web are up."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Servers did not become healthy in time."
          echo "--- api.log ---"
          tail -50 /tmp/api.log || true
          echo "--- web.log ---"
          tail -50 /tmp/web.log || true
          exit 1

      - name: Run Playwright smoke spec
        run: bun run test:e2e
        working-directory: apps/web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: warn
